<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - SkillSync</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>SkillSync</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="organizer_dashboard.html">Dashboard</a></li>
                <li><a href="logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="dashboard">
            <h2>Organizer Dashboard</h2>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>Total Events</h3>
                    <p class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Active Events</h3>
                    <p class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Participants</h3>
                    <p class="stat-number">0</p>
                </div>
            </div>

            <div class="dashboard-actions">
                <h3>Quick Actions</h3>
                <div class="action-buttons">
                    <button class="btn btn-primary">Create New Event</button>
                    <button class="btn btn-secondary">View All Events</button>
                    <button class="btn btn-secondary">Manage Participants</button>
                </div>
            </div>

            <div class="recent-events">
                <h3>Recent Events</h3>
                <div class="events-list">
                    <p>No events created yet.</p>
                    <!-- Event items will be populated here -->
                </div>
            </div>

            <div class="participant-management">
                <h3>Participant Management</h3>
                <div class="participants-list">
                    <p>No participants registered yet.</p>
                    <!-- Participant items will be populated here -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 SkillSync. All rights reserved.</p>
    </footer>
</body>
</html>
